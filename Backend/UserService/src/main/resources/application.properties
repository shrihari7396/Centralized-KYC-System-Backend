spring.application.name=USERSERVICE
spring.main.lazy-initialization=false
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer Configuration
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.rbi.userservice.event,org.rbi.kycmanagementservice.event
spring.kafka.consumer.properties.spring.json.value.default.type=org.rbi.userservice.event.KycVerificationSuccessEvent
spring.kafka.consumer.properties.spring.json.type.mapping=org.rbi.kycmanagementservice.event.KycVerificationSuccessEvent:org.rbi.userservice.event.KycVerificationSuccessEvent

logging.level.web=debug
