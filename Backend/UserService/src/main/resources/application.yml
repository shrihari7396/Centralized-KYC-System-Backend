spring:
  output:
    ansi:
      enabled: always
  application:
    name: USERSERVICE
  main:
    lazy-initialization: false
  datasource:
    url: jdbc:mysql://localhost:3306/kyc
    username: root
    password: 899961
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
  threads:
    virtual:
      enabled: true
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      bootstrap-servers: localhost:9092
      group-id: user-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: org.rbi.userservice.event,org.rbi.kycmanagementservice.event
        spring.json.value.default.type: org.rbi.userservice.event.KycVerificationSuccessEvent
        spring.json.type.mapping: org.rbi.kycmanagementservice.event.KycVerificationSuccessEvent:org.rbi.userservice.event.KycVerificationSuccessEvent

server:
  port: 8090

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 8460000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

encryption:
  secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
