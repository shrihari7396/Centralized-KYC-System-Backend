server:
  port: 8084

spring:
  output:
    ansi:
      enabled: always
  application:
    name: CONSENT-SERVICE
  datasource:
    url: jdbc:mysql://localhost:3306/kyc_consent_db?createDatabaseIfNotExist=true&useSSL=false
    username: root
    password: password # Replace with env specific password if needed
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      bootstrap-servers: localhost:9092
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            value:
              default:
                type: com.rbi.consent.event.ConsentRequestEvent

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true



logging:
  level:
    com.rbi.consent: DEBUG

encryption:
  secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

app:
  consent-url: "http://localhost:3000/consent"
