spring.application.name=KYCMANAGEMENTSERVICE
spring.output.ansi.enabled=always
server.port=8086

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/kyc
spring.datasource.username=root
spring.datasource.password=899961
spring.jpa.hibernate.ddl-auto=update
# Eureka Instance Configuration (FIX DNS ISSUE)
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =======================
# ? Kafka Configuration
# =======================

spring.kafka.bootstrap-servers=localhost:9092

# Consumer
spring.kafka.consumer.group-id=kyc-management-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ? Use ErrorHandlingDeserializer (IMPORTANT)
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# ? Delegate to JsonDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# ? Trust your packages (NOT * in production)
spring.kafka.consumer.properties.spring.json.trusted.packages=org.kyc.management.kycmanagementservice.event,org.kyc.digilockerService.event

# ? Default type mapping (important for cross-service)
spring.kafka.consumer.properties.spring.json.value.default.type=org.kyc.management.kycmanagementservice.event.DigiLockerDataFetchedEvent

# (Optional but BEST for microservices)
spring.kafka.consumer.properties.spring.json.type.mapping=org.kyc.digilockerService.event.DigiLockerDataFetchedEvent:org.kyc.management.kycmanagementservice.event.DigiLockerDataFetchedEvent


# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Encryption
encryption.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970