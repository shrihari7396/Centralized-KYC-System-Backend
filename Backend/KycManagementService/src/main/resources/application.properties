spring.application.name=KYCMANAGEMENTSERVICE
spring.output.ansi.enabled=always
server.port=8086

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/kyc
spring.datasource.username=root
spring.datasource.password=899961
spring.jpa.hibernate.ddl-auto=update

# Eureka
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# =======================
# Kafka Configuration
# =======================

spring.kafka.bootstrap-servers=localhost:9092

# Consumer
spring.kafka.consumer.group-id=kyc-management-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Delegate JSON
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# ✅ TRUST BOTH PACKAGES
spring.kafka.consumer.properties.spring.json.trusted.packages=org.rbi.kycmanagementservice.event,org.rbi.consentservice.event,org.kyc.digilockerService.event

# ❌ REMOVE DEFAULT TYPE (VERY IMPORTANT)
# spring.kafka.consumer.properties.spring.json.value.default.type=...

# ✅ TYPE MAPPING (THIS FIXES YOUR ERROR)
spring.kafka.consumer.properties.spring.json.type.mapping=\
org.rbi.consentservice.event.ConsentResponseEvent:org.rbi.kycmanagementservice.event.ConsentResponseEvent,\
org.kyc.digilockerService.event.DigiLockerDataFetchedEvent:org.rbi.kycmanagementservice.event.DigiLockerDataFetchedEvent

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Encryption
encryption.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970