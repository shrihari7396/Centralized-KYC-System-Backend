spring:
  output:
    ansi:
      enabled: always

  application:
    name: LogMonitoringSystem

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: sentientgate-logging-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500

      # ✅ Correct deserializers
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

        # ✅ FIXED (your actual DTO)
        spring.json.value.default.type: org.rbi.logmonitoringsystem.dtos.LogEventDTO

        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

    listener:
      concurrency: 3
      type: batch
      ack-mode: batch

  datasource:
    url: jdbc:mysql://localhost:3306/kyc
    username: root
    password: 899961
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
