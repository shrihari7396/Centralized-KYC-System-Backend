spring:
  output:
    ansi:
      enabled: always

  application:
    name: API-GATEWAY

  # --- KAFKA CONFIG ---
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # --- REDIS CONFIG ---
  data:
    redis:
      host: localhost
      port: 6379

  # --- CLOUD GATEWAY CONFIG ---
  cloud:
    gateway:
      server:
        webflux:
          routes:

            # --- USER SERVICE ---
            - id: user-service
              uri: lb://USERSERVICE
              predicates:
                - Path=/user/**

            # --- BANK SERVICE ---
            - id: bank-service
              uri: lb://BANKSERVICE
              predicates:
                - Path=/bank/**

            # --- CONSENT SERVICE ---
            - id: consent-service
              uri: lb://CONSENT-SERVICE
              predicates:
                - Path=/consents/**

            # --- KYC SERVICE ---
            - id: kyc-management-service
              uri: lb://KYCMANAGEMENTSERVICE
              predicates:
                - Path=/api/kyc/**

            # --- DIGILOCKER SERVICE ---
            - id: digilocker-service
              uri: lb://DIGILOCKERSERVICE
              predicates:
                - Path=/api/digilocker/**

            # --- AI SERVICE ---
            - id: ai-service
              uri: lb://AISERVICE
              predicates:
                - Path=/ai/**

            # --- WEBSOCKET SERVICE ---
            - id: notification-ws
              uri: lb://NOTIFICATION-SYSTEM
              predicates:
                - Path=/ws/**

      # ❌ IMPORTANT: NO GLOBAL CORS HERE (to avoid duplication)