server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: API-GATEWAY
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    web-application-type: reactive

  # Kafka configuration for gateway access logging
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # Redis for token blacklist and distributed rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # Cloud Gateway routing definitions
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USERSERVICE
              predicates:
                - Path=/user/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

            - id: bank-service
              uri: lb://BANKSERVICE
              predicates:
                - Path=/bank/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

            - id: consent-service
              uri: lb://CONSENT-SERVICE
              predicates:
                - Path=/consents/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

            - id: kyc-management-service
              uri: lb://KYCMANAGEMENTSERVICE
              predicates:
                - Path=/api/kyc/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

            - id: digilocker-service
              uri: lb://DIGILOCKERSERVICE
              predicates:
                - Path=/api/digilocker/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

            - id: ai-service
              uri: lb://AISERVICE
              predicates:
                - Path=/ai/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

            - id: notification-ws
              uri: lb:ws://NOTIFICATION-SYSTEM
              predicates:
                - Path=/ws/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
            add-to-simple-url-handler-mapping: true

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}

# Security & JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION_MS:3600000}
  issuer: ${JWT_ISSUER:https://auth.kyc-system.com}
  audience: ${JWT_AUDIENCE:https://api.kyc-system.com}

apigateway:
  security:
    secret-key: ${APIGATEWAY_SECURITY_SECRET_KEY:default_gateway_hmac_secret_key_32bytes}

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.rbi.apigateway: INFO

---
spring:
  config:
    activate:
      on-profile: test
eureka:
  client:
    enabled: false
spring.kafka.bootstrap-servers: localhost:9092
