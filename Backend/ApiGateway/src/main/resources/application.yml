spring:
  output:
    ansi:
      enabled: always
  application:
    name: API-GATEWAY

  # --- KAFKA CONFIG ---
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # --- REDIS CONFIG ---
  data:
    redis:
      host: localhost
      port: 6379

  # --- CLOUD GATEWAY CONFIG (MIGRATED KEYS) ---
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USERSERVICE
              predicates:
                - Path=/user/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

            - id: bank-service
              uri: lb://BANKSERVICE
              predicates:
                - Path=/bank/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

            - id: consent-service
              uri: lb://CONSENT-SERVICE
              predicates:
                - Path=/consents/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

            - id: kyc-management-service
              uri: lb://KYCMANAGEMENTSERVICE
              predicates:
                - Path=/api/kyc/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

            - id: digilocker-service
              uri: lb://DIGILOCKERSERVICE
              predicates:
                - Path=/api/digilocker/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

            - id: AI_SERVICE
              uri: lb://AISERVICE
              predicates:
                - Path=/ai/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

            - id: notification-ws
              uri: lb:ws://NOTIFICATION-SYSTEM
              predicates:
                - Path=/ws/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
            add-to-simple-url-handler-mapping: true

# --- EUREKA CONFIG ---
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# --- SERVER CONFIG ---
server:
  port: 8083

# --- SECURITY / CUSTOM PROPS ---
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 864000000

# --- LOGGING ---
logging:
  level:
    org:
      springframework:
        web: DEBUG
        cloud:
          gateway: DEBUG