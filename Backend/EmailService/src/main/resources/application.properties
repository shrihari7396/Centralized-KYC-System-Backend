spring.application.name=EMAILSERVICE
spring.output.ansi.enabled=always
spring.config.import=optional:file:.env

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


spring.threads.virtual.enabled=true

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=email-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust all relevant packages for event deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=org.kyc.emailservice.event,org.rbi.*

# Map incoming event classes from other services to our local EmailService DTOs
spring.kafka.consumer.properties.spring.json.type.mapping=\
  org.rbi.userservice.kafkaEvents.CreateOtpEvent:org.kyc.emailservice.event.CreateOtpEvent,\
  org.rbi.consentservice.event.CreateOtpEvent:org.kyc.emailservice.event.CreateOtpEvent,\
  org.rbi.userservice.event.KycVerificationSuccessEvent:org.kyc.emailservice.event.KycVerificationSuccessEvent,\
  org.rbi.kycmanagementservice.event.KycVerificationSuccessEvent:org.kyc.emailservice.event.KycVerificationSuccessEvent

# Enable Kafka Debug Logging for verification
logging.level.org.springframework.kafka=DEBUG

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
