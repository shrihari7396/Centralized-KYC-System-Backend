server:
  servlet:
    context-path: /api/emailService/
  port: 8092

spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:0}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}
