spring:
  application:
    name: DigilockerService
  output:
    ansi:
      enabled: always
server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Logging for OTP
logging:
  level:
    org.kyc.digilockerService: INFO
