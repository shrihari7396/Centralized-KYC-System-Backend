spring:
  application:
    name: DIGILOCKERSERVICE
  output:
    ansi:
      enabled: always
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
server:
  port: 8088

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true


# Logging for OTP
logging:
  level:
    org.kyc.digilockerService: INFO

secret:
  key: askjdfkjasdkjfkjasdhfjhaskjdhfkjhasdkjfh
