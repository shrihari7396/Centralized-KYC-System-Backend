apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kyc-ingress
  namespace: kyc-system
  labels:
    app.kubernetes.io/name: kyc-ingress
    app.kubernetes.io/part-of: centralized-kyc-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "false" # CORS handled at ApiGateway layer
spec:
  tls:
    - hosts:
        - kyc.rbi.org.in
      secretName: kyc-tls-secret
  rules:
    - host: kyc.rbi.org.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
