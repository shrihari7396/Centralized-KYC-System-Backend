apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-service
  namespace: kyc-system
  labels:
    app.kubernetes.io/name: bank-service
    app.kubernetes.io/instance: bank-service-v1
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: banking-portal
    app.kubernetes.io/part-of: centralized-kyc-system
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: bank-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bank-service
        app.kubernetes.io/component: banking-portal
        app.kubernetes.io/part-of: centralized-kyc-system
    spec:
      containers:
        - name: bank-service
          image: kyc-system/bank-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
              name: http
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8091"
            - name: SPRING_APPLICATION_NAME
              value: "BANKSERVICE"
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kyc-secrets
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://root:$(MONGO_PASSWORD)@mongodb:27017/kyc_db?authSource=admin"
            - name: SPRING_MONGODB_URI
              value: "mongodb://root:$(MONGO_PASSWORD)@mongodb:27017/kyc_db?authSource=admin"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
            - name: ENCRYPTION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kyc-secrets
                  key: ENCRYPTION_SECRET_KEY
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            tcpSocket:
              port: 8091
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: 8091
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8091
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: bank-service
  namespace: kyc-system
  labels:
    app.kubernetes.io/name: bank-service
    app.kubernetes.io/component: banking-portal
    app.kubernetes.io/part-of: centralized-kyc-system
spec:
  type: ClusterIP
  ports:
    - port: 8091
      targetPort: 8091
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: bank-service
