apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent-service
  namespace: kyc-system
  labels:
    app.kubernetes.io/name: consent-service
    app.kubernetes.io/instance: consent-service-v1
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: consent-governance
    app.kubernetes.io/part-of: centralized-kyc-system
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: consent-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consent-service
        app.kubernetes.io/component: consent-governance
        app.kubernetes.io/part-of: centralized-kyc-system
    spec:
      containers:
        - name: consent-service
          image: kyc-system/consent-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: SPRING_APPLICATION_NAME
              value: "CONSENT-SERVICE"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/kyc_consent_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kyc-secrets
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kyc-secrets
                  key: MYSQL_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: REDIS_PORT
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
            - name: ENCRYPTION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kyc-secrets
                  key: ENCRYPTION_SECRET_KEY
            - name: APP_CONSENT_URL
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: APP_CONSENT_URL
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: 8084
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: consent-service
  namespace: kyc-system
  labels:
    app.kubernetes.io/name: consent-service
    app.kubernetes.io/component: consent-governance
    app.kubernetes.io/part-of: centralized-kyc-system
spec:
  type: ClusterIP
  ports:
    - port: 8084
      targetPort: 8084
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: consent-service
