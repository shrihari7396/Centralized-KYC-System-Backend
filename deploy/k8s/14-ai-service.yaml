apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: kyc-system
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/instance: ai-service-v1
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: ai-verification
    app.kubernetes.io/part-of: centralized-kyc-system
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/component: ai-verification
        app.kubernetes.io/part-of: centralized-kyc-system
    spec:
      containers:
        - name: ai-service
          image: kyc-system/ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8089
              name: http
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8089"
            - name: SPRING_APPLICATION_NAME
              value: "AISERVICE"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kyc-secrets
                  key: GROQ_API_KEY
            - name: GROQ_API_URL
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: GROQ_API_URL
            - name: GROQ_API_MODEL
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: GROQ_API_MODEL
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: 8089
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: 8089
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8089
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: kyc-system
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai-verification
    app.kubernetes.io/part-of: centralized-kyc-system
spec:
  type: ClusterIP
  ports:
    - port: 8089
      targetPort: 8089
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: ai-service
