apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: kyc-system
  labels:
    app.kubernetes.io/name: discovery-service
    app.kubernetes.io/instance: discovery-service-v1
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: service-discovery
    app.kubernetes.io/part-of: centralized-kyc-system
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: discovery-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discovery-service
        app.kubernetes.io/component: service-discovery
        app.kubernetes.io/part-of: centralized-kyc-system
    spec:
      containers:
        - name: discovery-service
          image: kyc-system/discovery-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
              name: http
              protocol: TCP
          env:
            - name: SPRING_APPLICATION_NAME
              value: "discovery-service"
            - name: SERVER_PORT
              value: "8761"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "discovery-service"
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /
              port: 8761
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: 8761
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8761
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: kyc-system
  labels:
    app.kubernetes.io/name: discovery-service
    app.kubernetes.io/component: service-discovery
    app.kubernetes.io/part-of: centralized-kyc-system
spec:
  type: ClusterIP
  ports:
    - port: 8761
      targetPort: 8761
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: discovery-service
