apiVersion: v1
kind: Secret
metadata:
  name: kyc-secrets
  namespace: kyc-system
  labels:
    app.kubernetes.io/name: kyc-secrets
    app.kubernetes.io/part-of: centralized-kyc-system
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  # Relational Database (MySQL) Credentials
  MYSQL_ROOT_PASSWORD: "REPLACE_WITH_SECURE_MYSQL_ROOT_PASSWORD"
  MYSQL_USER: "kyc_user"
  MYSQL_PASSWORD: "REPLACE_WITH_SECURE_MYSQL_USER_PASSWORD"

  # Document Database (MongoDB) Credentials
  MONGO_INITDB_ROOT_USERNAME: "kyc_mongo_admin"
  MONGO_INITDB_ROOT_PASSWORD: "REPLACE_WITH_SECURE_MONGO_PASSWORD"

  # Security, JWT & Encryption Keys (256-bit Hex)
  JWT_SECRET: "REPLACE_WITH_64_CHAR_HEX_RANDOM_SECRET_KEY_FOR_JWT_SIGNING"
  JWT_TOKEN: "REPLACE_WITH_64_CHAR_HEX_RANDOM_SECRET_KEY_FOR_JWT_SIGNING"
  ENCRYPTION_SECRET_KEY: "REPLACE_WITH_64_CHAR_HEX_RANDOM_SECRET_KEY_FOR_AES_ENCRYPTION"
  APIGATEWAY_SECURITY_SECRET_KEY: "REPLACE_WITH_SECURE_GATEWAY_HMAC_SECRET_KEY"
  DIGILOCKER_SECRET_KEY: "REPLACE_WITH_64_CHAR_HEX_RANDOM_SECRET_KEY_FOR_DIGILOCKER"

  # External Integrations
  GROQ_API_KEY: "REPLACE_WITH_GROQ_API_KEY"
  SMTP_USERNAME: "no-reply@kyc-system.com"
  SMTP_PASSWORD: "REPLACE_WITH_SMTP_APP_PASSWORD"
