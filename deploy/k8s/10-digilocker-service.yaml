apiVersion: apps/v1
kind: Deployment
metadata:
  name: digilocker-service
  namespace: kyc-system
  labels:
    app.kubernetes.io/name: digilocker-service
    app.kubernetes.io/instance: digilocker-service-v1
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: government-integration
    app.kubernetes.io/part-of: centralized-kyc-system
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: digilocker-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: digilocker-service
        app.kubernetes.io/component: government-integration
        app.kubernetes.io/part-of: centralized-kyc-system
    spec:
      containers:
        - name: digilocker-service
          image: kyc-system/digilocker-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
              name: http
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8088"
            - name: SPRING_APPLICATION_NAME
              value: "DIGILOCKERSERVICE"
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: REDIS_PORT
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: kyc-global-config
                  key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kyc-secrets
                  key: DIGILOCKER_SECRET_KEY
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: 8088
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8088
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: digilocker-service
  namespace: kyc-system
  labels:
    app.kubernetes.io/name: digilocker-service
    app.kubernetes.io/component: government-integration
    app.kubernetes.io/part-of: centralized-kyc-system
spec:
  type: ClusterIP
  ports:
    - port: 8088
      targetPort: 8088
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: digilocker-service
