apiVersion: v1
kind: ConfigMap
metadata:
  name: kyc-global-config
  namespace: kyc-system
  labels:
    app.kubernetes.io/name: kyc-global-config
    app.kubernetes.io/part-of: centralized-kyc-system
    app.kubernetes.io/managed-by: kubectl
data:
  # Eureka Service Discovery
  EUREKA_SERVER_URL: "http://discovery-service:8761/eureka"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-service:8761/eureka"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

  # Event Streaming - Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # Caching & Session Storage - Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Relational Database - MySQL
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"

  # Document Database - MongoDB
  MONGODB_HOST: "mongodb"
  MONGODB_PORT: "27017"
  MONGODB_DATABASE: "kyc_db"

  # AI Service Parameters
  GROQ_API_URL: "https://api.groq.com/openai/v1/chat/completions"
  GROQ_API_MODEL: "llama-3.3-70b-versatile"

  # Email Service Configuration
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_AUTH: "true"
  SMTP_STARTTLS_ENABLE: "true"
  SMTP_FROM: "no-reply@kyc-system.com"

  # Consent Callback URL
  APP_CONSENT_URL: "http://localhost:3000/consent"
